<script>
const PROFILES_URL = "https://mscholar-edu.github.io/my-fast-sheet-cache/profiles.json";
if (sessionStorage.getItem("loggedIn")!== "true") { window.location.href = "index.html"; }
const sidebar=document.getElementById("sidebar"), overlay=document.getElementById("overlay"), pageWrapper=document.getElementById("pageWrapper"), body=document.body;
function openMenu(){ sidebar.classList.add("show"); overlay.classList.add("show"); pageWrapper.classList.add("shifted"); body.classList.add("no-scroll"); }
function closeMenu(){ sidebar.classList.remove("show"); overlay.classList.remove("show"); pageWrapper.classList.remove("shifted"); body.classList.remove("no-scroll"); }
function logout(){ sessionStorage.clear(); window.location.href="index.html"; }
document.getElementById("hamburger").addEventListener("click", openMenu); overlay.addEventListener("click", closeMenu);
document.querySelectorAll(".dropdown-button").forEach(button=>{ button.addEventListener("click",()=>{ const content = button.nextElementSibling; const arrow = button.querySelector(".arrow"); document.querySelectorAll(".dropdown-content").forEach(d => { if(d!== content) d.classList.remove("show"); }); document.querySelectorAll(".arrow").forEach(a => { if(a!== arrow) { a.classList.remove("rotate"); a.textContent = "⌄"; } }); content.classList.toggle("show"); arrow.classList.toggle("rotate"); arrow.textContent = content.classList.contains("show")? "^" : "⌄"; }); });
const fileInput=document.getElementById("fileInput"), avatarImg=document.getElementById("avatarImg"), avatarInitial=document.getElementById("avatarInitial");
document.getElementById("changeBtn").addEventListener("click",()=>fileInput.click());
fileInput.addEventListener("change",function(){ const f=this.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ avatarImg.src=e.target.result; avatarImg.style.display="block"; avatarInitial.style.display="none"; localStorage.setItem("profilePic_"+sessionStorage.getItem("studentID"), e.target.result); }; r.readAsDataURL(f); });
async function loadProfile(){
  const lrn = sessionStorage.getItem("studentID");
  const savedPic = localStorage.getItem("profilePic_"+lrn);
  if(savedPic){ avatarImg.src=savedPic; avatarImg.style.display="block"; avatarInitial.style.display="none"; }
  try {
    document.getElementById("loadingText").style.display="block";
    const res = await fetch(`${PROFILES_URL}?t=${Date.now()}`);
    const profiles = await res.json();
    document.getElementById("loadingText").style.display="none";
    // Find by LRN - adjust keys to your sheet headers
    const p = profiles.find(row => String(row.LRN||row.lrn||"").trim() === String(lrn).trim());
    if(p){ fillTable(p); }
    else {
      const fallbackName = sessionStorage.getItem("studentName") || "";
      document.getElementById("tdLrn").textContent = lrn; document.getElementById("tdName").textContent = fallbackName;
      document.getElementById("profileFullName").textContent = fallbackName.toUpperCase();
      document.getElementById("sideStudentName").textContent = fallbackName.toUpperCase()+"!";
      document.getElementById("loadingText").textContent = "Profile not yet set in STUDENTS PROFILE sheet."; document.getElementById("loadingText").style.display="block";
    }
  } catch(e){ console.error(e); document.getElementById("loadingText").textContent = "Failed to load profiles.json - check if Action is green"; }
}
function fillTable(p){
  const get = (k1,k2,k3) => p[k1]||p[k2]||p[k3]||"-";
  document.getElementById("tdLrn").textContent = get("LRN","lrn","Lrn");
  document.getElementById("tdName").textContent = get("NAME","Name","name");
  document.getElementById("tdGrade").textContent = get("GRADE LEVEL","Grade","grade");
  document.getElementById("tdSection").textContent = get("SECTION","Section","section");
  document.getElementById("tdTrack").textContent = get("TRACK","Track","track");
  document.getElementById("tdBirth").textContent = get("BIRTH DATE","Birth","birth");
  document.getElementById("tdAddress").textContent = get("HOME ADDRESS","Address","address");
  document.getElementById("tdContact").textContent = get("CONTACT NUMBER","Contact","contact");
  document.getElementById("tdEmail").textContent = get("EMAIL","Email","email");
  document.getElementById("tdParentName").textContent = get("PARENT/GUARDIAN NAME","Parent","parentName");
  document.getElementById("tdParentContact").textContent = get("P/G CONTACT NUMBER","ParentContact","parentContact");
  document.getElementById("profileFullName").textContent = (get("NAME","Name","name")).toUpperCase();
  document.getElementById("sideStudentName").textContent = (get("NAME","Name","name")||sessionStorage.getItem("studentName")||"STUDENT").toUpperCase()+"!";
  document.getElementById("avatarInitial").textContent = (get("NAME","Name","name")||"S").trim().charAt(0).toUpperCase();
  document.getElementById("profileTrack").textContent = get("TRACK","Track","track") + " - " + get("GRADE LEVEL","Grade","grade");
}
document.addEventListener("DOMContentLoaded", loadProfile);
</script>
