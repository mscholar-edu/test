<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MScholar - Change Password</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Cambria, serif; background: #f3f3f3; color: #1f5e2f; }
.header { background: #145d23; color: #fff; padding: 20px; text-align: center; }
.container { text-align: center; padding: 50px 20px; }
.login-box { width: 90%; max-width: 450px; margin: 0 auto; background: #ececec; border-radius: 15px; padding: 35px 25px; display: flex; flex-direction: column; gap: 15px; }
.student-id { width: 100%; padding: 16px; border: none; border-radius: 10px; background: #b9c4b2; outline:none; }
.login-btn { width: 100%; padding: 16px; border: none; border-radius: 10px; background: #145d23; color: #fff; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header class="header"><h1>M SCHOLAR</h1></header>
<div class="container">
  <div class="login-box">
    <h2>Change Your Password</h2>
    <p style="font-size:.8rem">For security, you must change your default password (your LRN).</p>
    <input type="password" id="newPass" class="student-id" placeholder="New Password">
    <input type="password" id="confirmPass" class="student-id" placeholder="Confirm New Password">
    <button class="login-btn" id="saveBtn" onclick="saveNewPassword()">Save & Continue</button>
  </div>
</div>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz6sGOVgW6R6Im6uWSIM2-gK9XWfxgTYdnADkj8l2ESvJBQBzajhUnxY3dKFyDi-8djvQ/exec";
async function saveNewPassword(){
  const lrn = sessionStorage.getItem("studentID");
  const newPass = document.getElementById("newPass").value.trim();
  const confirm = document.getElementById("confirmPass").value.trim();
  if(!lrn){ alert("Session expired. Login again."); window.location.href="index.html"; return; }
  if(newPass.length < 6){ alert("Password must be at least 6 characters"); return; }
  if(newPass!== confirm){ alert("Passwords do not match!"); return; }
  if(newPass === lrn){ alert("New password cannot be your LRN"); return; }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "Saving...";

  try{
    const res = await fetch(`${WEB_APP_URL}?action=changePassword&lrn=${encodeURIComponent(lrn)}&newPassword=${encodeURIComponent(newPass)}`);
    const result = await res.json();
    if(result.success){
      alert("Password changed successfully!");
      window.location.href = "loginaccessapproved.html";
    } else { alert(result.message); }
  } catch(e){ alert("Failed to connect"); }
  finally{ btn.disabled = false; btn.textContent = "Save & Continue"; }
}
</script>
</body>
</html>
