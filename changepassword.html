<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MScholar - Change Password</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Cambria,Georgia,serif;background:#f3f3f3;color:#1f5e2f}.header{background:#145d23;color:#fff;padding:20px 30px;border-bottom:6px solid #c6cec2;text-align:center}.header h1{font-size:1.7rem;font-weight:bold;margin:0}.container{text-align:center;padding:50px 20px 80px}.logo{width:170px;height:auto;display:block;margin:0 auto 40px}.welcome{font-size:.95rem;margin-bottom:25px}.description{max-width:700px;margin:0 auto;font-size:.85rem;font-style:italic;line-height:1.8}.divider{width:85%;max-width:800px;height:3px;background:#b5c1ae;margin:40px auto 55px}.login-box{width:90%;max-width:450px;margin:0 auto;background:#ececec;border-radius:15px;padding:35px 25px;display:flex;flex-direction:column;gap:15px}.login-box h2{font-size:1.05rem;margin-bottom:10px}.input-group{position:relative;width:100%}.student-id{width:100%;padding:16px 18px;border:none;border-radius:10px;background:#b9c4b2;color:#1f5e2f;font-family:Cambria,serif;font-size:.85rem;outline:none}.student-id::placeholder{color:transparent}.input-group label{position:absolute;left:18px;top:16px;color:#2a5d34;font-size:.85rem;pointer-events:none;transition:.25s}.input-group input:focus+label,.input-group input:not(:placeholder-shown)+label{top:-10px;left:12px;font-size:12px;color:#145d23;background:#f3f3f3;padding:0 4px;border-radius:4px}.login-btn{width:100%;padding:16px;border:none;border-radius:10px;background:#145d23;color:#fff;font-family:Cambria,serif;font-size:.9rem;font-weight:bold;cursor:pointer}.footer-top{background:#bcc8b7;padding:35px 25px;color:#1f5e2f}.footer-bottom{background:#145d23;color:#fff;text-align:center;padding:15px;font-size:.7rem}
</style>
</head>
<body>
<header class="header"><h1>M SCHOLAR</h1></header>
<section class="container">
<img src="mscholarlogo.png" class="logo">
<div class="welcome">Welcome to M SCHOLAR</div>
<div class="description">For first time login, please create your new password. It will be saved and synced to fast cache.</div>
<div class="divider"></div>
<div class="login-box">
<h2>Create New Password</h2>
<div class="input-group"><input type="password" id="newPassword" class="student-id" placeholder=" "><label>New Password</label></div>
<div class="input-group"><input type="password" id="confirmPassword" class="student-id" placeholder=" "><label>Confirm Password</label></div>
<button class="login-btn" id="saveBtn" onclick="savePassword()">Save Password</button>
</div>
</section>
<footer><div class="footer-top"><h3>M SCHOLAR</h3><p>M Scholar is a personal learning and research hub.</p></div><div class="footer-bottom">© Copyright 2026 M SCHOLAR | Research Office</div></footer>
<script>
const WRITE_URL = "https://script.google.com/macros/s/AKfycbz6sGOVgW6R6Im6uWSIM2-gK9XWfxgTYdnADkj8l2ESvJBQBzajhUnxY3dKFyDi-8djvQ/exec";
async function savePassword(){
  const lrn=sessionStorage.getItem("studentID");
  const pass1=document.getElementById("newPassword").value.trim();
  const pass2=document.getElementById("confirmPassword").value.trim();
  const btn=document.getElementById("saveBtn");
  if(!lrn){alert("Session expired. Login again.");location.href="index.html";return;}
  if(!pass1){alert("Enter password");return;}
  if(pass1.length<6){alert("At least 6 characters");return;}
  if(pass1!==pass2){alert("Passwords do not match");return;}
  try{
    btn.disabled=true;btn.textContent="Saving...";
    const res=await fetch(WRITE_URL,{method:"POST",body:JSON.stringify({action:"changePassword",lrn:lrn,newPassword:pass1})});
    const result=await res.json();
    if(result.success){
      alert("Password Saved! You can now login with new password. Cache will update in 1 hour.");
      location.href="loginaccessapproved.html";
    }else{alert(result.message||"Failed to save");}
  }catch(e){console.error(e);alert("Failed. Make sure Web App is deployed as Anyone can access");}finally{btn.disabled=false;btn.textContent="Save Password";}
}
</script>
</body>
</html>
